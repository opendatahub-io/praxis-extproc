# cargo-nextest configuration. Run locally with `cargo nextest run --workspace`.
# nextest runs each test in its own process (isolation) and does not run
# doctests, so CI pairs `cargo nextest run` with `cargo test --doc`.

[profile.default]
# Surface every failure in a run, not just the first.
fail-fast = false

[profile.ci]
fail-fast = false
# Integration tests bind servers on ephemeral ports; allow one retry in CI to
# absorb rare port/startup races. Local runs (default profile) do not retry, so
# genuine flakiness stays visible during development.
retries = 1
slow-timeout = { period = "30s", terminate-after = 3 }
