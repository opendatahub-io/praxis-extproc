# Advisories ignored by `cargo audit`. Matches the deny.toml [advisories]
# ignore list so bare `cargo audit` (CI's supply-chain action) and
# `cargo deny check` (Makefile) agree.

[advisories]
ignore = [
    # Pingora transitive dependencies; not under our control.
    # rustls-pemfile 2.2.0: unmaintained (via pingora-rustls)
    "RUSTSEC-2025-0134",

    # praxis-ai transitive dep: sqlx -> sqlx-sqlite -> libsqlite3-sys.
    # 0.37 -> 0.39 is a 0.x semver-breaking bump that cargo update
    # cannot resolve; requires praxis-ai to upgrade its sqlx fork.
    # CVE-2026-119375 (medium 6.8): only exploitable when opening a
    # crafted WAL file from an untrusted source; not applicable here.
    "RUSTSEC-2026-0459",
]
