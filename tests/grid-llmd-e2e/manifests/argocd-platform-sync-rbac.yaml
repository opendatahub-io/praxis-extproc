apiVersion: v1
kind: Namespace
metadata:
  name: kuadrant-system
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/part-of: grid-llmd-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grid-llmd-platform-sync
  labels:
    app.kubernetes.io/part-of: grid-llmd-e2e
rules:
- apiGroups: [datasciencecluster.opendatahub.io]
  resources: [datascienceclusters]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [dscinitialization.opendatahub.io]
  resources: [dscinitializations]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [gateway.networking.k8s.io]
  resources: [gatewayclasses]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grid-llmd-platform-sync
  labels:
    app.kubernetes.io/part-of: grid-llmd-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grid-llmd-platform-sync
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grid-llmd-platform-sync
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: grid-llmd-e2e
rules:
- apiGroups: [gateway.networking.k8s.io]
  resources: [gateways]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grid-llmd-platform-sync
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: grid-llmd-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grid-llmd-platform-sync
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grid-llmd-platform-sync
  namespace: kuadrant-system
  labels:
    app.kubernetes.io/part-of: grid-llmd-e2e
