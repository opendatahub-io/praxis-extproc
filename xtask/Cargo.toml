[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Red Hat, Inc."]
license = "Apache-2.0"
repository = "https://github.com/opendatahub-io/praxis-extproc"
description = "Development task runner for praxis-extproc"
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.1", features = ["derive"] }
# zlib-ng, the backend the Pingora fork already builds, so no second inflater.
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-ng"] }
object = { version = "0.39.1", default-features = false, features = ["read_core", "elf", "std"] }
openssl = "0.10.81"
regex = "1.13.1"
# `fips host-check` deserializes the compiled-in certified modules list.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
