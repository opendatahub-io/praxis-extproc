[package]
name = "praxis-extproc-testsupport"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Red Hat, Inc."]
license = "Apache-2.0"
description = "Shared test harness for praxis-extproc integration tests"
publish = false

# Deliberately does not inherit `[lints] workspace = true`: this is a dev-only
# harness crate, so the strict `missing_docs`/restriction denies the product
# crate carries would force docs on every helper for no benefit.

[dependencies]
# No default features: the harness only uses config/server/response_mode, which
# are feature-independent. Forcing defaults here would drag the non-FIPS feature
# set (and its `sha2`) into the FIPS dependency graph.
praxis-extproc = { path = "..", default-features = false }
praxis-ai-filters = { git = "https://github.com/praxis-proxy/ai.git", tag = "v0.9.0", default-features = false }
praxis-filter = { version = "0.7.4", package = "praxis-proxy-filter", default-features = false }
praxis-proto = { path = "../proto", package = "praxis-proxy-proto" }
async-trait = "0.1.89"
bytes = "1.11.1"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
serde_json = "1.0.151"
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = { version = "0.14.6", features = ["transport"] }
