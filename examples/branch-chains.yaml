# Example ExtProc configuration demonstrating branch chains.
#
# This config shows that full Praxis pipeline features work in
# ExtProc mode, including conditional branching on filter results.
# The guardrails filter runs in `flag` mode so a match records a
# `blocked` result instead of rejecting; the branch reacts to that
# result and tags the request before the pipeline continues.
#
# Branch conditions are evaluated when a filter's request phase
# completes, so the rule inspects a header. Body rules only run once
# the body arrives, after branch evaluation.
#
# Start:
#   praxis-extproc -c examples/branch-chains.yaml

server:
  grpc_address: "0.0.0.0:50051"
  tls:
    mode: none

filter_chains:
  - name: main
    filters:
      - filter: request_id

      - filter: guardrails
        action: flag
        rules:
          - target: header
            name: "x-content-class"
            contains: "blocked"
        branch_chains:
          - name: tag_blocked_content
            on_result:
              filter: guardrails
              result: blocked
            rejoin: next
            chains:
              - name: tag
                filters:
                  - filter: headers
                    request_add:
                      - name: X-Content-Blocked
                        value: "true"

      - filter: headers
        request_add:
          - name: X-Processed
            value: "true"
