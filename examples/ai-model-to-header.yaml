# Example ExtProc configuration using Praxis AI filters.
#
# Extracts the JSON "model" field into X-AI-Model via json_body request_extract.
#
# Start:
#   praxis-extproc -c examples/ai-model-to-header.yaml

server:
  grpc_address: "0.0.0.0:50051"
  health_address: "0.0.0.0:50052"
  metrics_address: "0.0.0.0:9090"
  tls:
    mode: none

filter_chains:
  - name: observability
    filters:
      - filter: request_id

  - name: ai
    filters:
      # `unless` trusts an existing X-AI-Model. For untrusted ingress, drop it
      # and strip the header with `headers request_remove` before json_body.
      - filter: json_body
        conditions:
          - unless:
              headers_present: ["X-AI-Model"]
        request_extract:
          - pointer: /model
            header: X-AI-Model
        on_invalid: continue

  - name: transformation
    filters:
      - filter: headers
        request_add:
          - name: X-Processed-By
            value: praxis-extproc

insecure_options:
  allow_unbounded_body: true
