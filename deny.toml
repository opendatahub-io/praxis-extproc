[advisories]
unmaintained = "all"
maximum-db-staleness = "P30D"
ignore = [
    # Pingora transitive dependencies; not under our control.
    # rustls-pemfile 2.2.0: unmaintained (via pingora-rustls)
    "RUSTSEC-2025-0134",
    # libsqlite3-sys 0.37.0 (C SQLite CVE-2026-119375), via sqlx-sqlite ->
    # praxis-ai-store-backends. The fix is libsqlite3-sys >=0.39, but the pinned
    # praxis-proxy/sqlx FIPS fork (and upstream sqlx 0.9.0) still require <0.38, so
    # it cannot be bumped from here. Only exercised when the SQLite response-store
    # backend is selected; production uses Postgres. Tracked for a sqlx-fork bump.
    "RUSTSEC-2026-0459",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/praxis-proxy/ai",
    # praxis-ai's cert-auth Postgres store builds on the praxis-proxy sqlx fork.
    "https://github.com/praxis-proxy/sqlx",
]
