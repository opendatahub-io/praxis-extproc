apiVersion: apps/v1
kind: Deployment
metadata:
  name: payload-processing-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payload-processing-streaming
  template:
    metadata:
      labels:
        app: payload-processing-streaming
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: payload-processing-streaming
          image: praxis-extproc
          imagePullPolicy: Never
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          args:
            - -c
            - /etc/praxis/extproc.yaml
          ports:
            - containerPort: 9004
              name: grpc
              protocol: TCP
            - containerPort: 50052
              name: health
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            grpc:
              port: 50052
              service: envoy.service.ext_proc.v3.ExternalProcessor
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: plugins-config-volume
              mountPath: /etc/praxis
              readOnly: true
      volumes:
        - name: plugins-config-volume
          configMap:
            name: payload-processing-streaming-plugins
