apiVersion: v1
kind: Namespace
metadata:
  name: llm
---
# The external route uses a separate in-cluster simulator so CI never depends
# on a public IP or skips qualification when a hosted model is unavailable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-model
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-model
  template:
    metadata:
      labels:
        app: external-model
    spec:
      containers:
        - name: simulator
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          args: ["--model", "gpt-4", "--port", "8080", "--mode", "echo"]
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-katan
  namespace: llm
spec:
  selector:
    app: external-model
  ports:
    - name: http
      port: 443
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: e2e-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
# Allow HTTPRoutes in istio-system to reference backends in llm namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: istio-system-to-llm
  namespace: llm
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: istio-system
  to:
    - group: ""
      kind: Service
---
# BBR model routes: header-based routing via X-Gateway-Model-Name.
# BBR ext-proc extracts "model" from request body, sets the header +
# clear_route_cache. If FDS deferral is broken the header mutation is
# silently dropped and no rule matches → 404.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: model-routes
  namespace: istio-system
spec:
  parentRefs:
    - name: e2e-gateway
  rules:
    # External model: gpt-4 → llm-katan (external provider)
    - matches:
        - headers:
            - name: X-Gateway-Model-Name
              type: Exact
              value: gpt-4
      backendRefs:
        - name: llm-katan
          namespace: llm
          port: 443
    # Internal model: granite-8b → in-cluster inference-sim
    - matches:
        - headers:
            - name: X-Gateway-Model-Name
              type: Exact
              value: granite-8b
      backendRefs:
        - name: internal-model
          namespace: llm
          port: 8080
---
# Direct path-based routes: no BBR header matching required.
# /direct/external/v1/... and /direct/internal/v1/... are rewritten
# to /v1/... before forwarding. Tests IPP in isolation without BBR.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: direct-routes
  namespace: istio-system
spec:
  parentRefs:
    - name: e2e-gateway
  rules:
    # Direct external: /direct/external/v1/... → llm-katan
    - matches:
        - path:
            type: PathPrefix
            value: /direct/external/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1
      backendRefs:
        - name: llm-katan
          namespace: llm
          port: 443
    # Direct internal: /direct/internal/v1/... → inference-sim
    - matches:
        - path:
            type: PathPrefix
            value: /direct/internal/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1
      backendRefs:
        - name: internal-model
          namespace: llm
          port: 8080
    # maas-api exemption probe for the maas-headers-guard: same
    # path shape as production's maas-api-route /maas-api/v1 rule.
    - matches:
        - path:
            type: PathPrefix
            value: /maas-api/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /v1
      backendRefs:
        - name: internal-model
          namespace: llm
          port: 8080
