apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: praxis-extproc-clusters
  namespace: istio-system
  labels:
    app.kubernetes.io/name: praxis-extproc
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: e2e-gateway
  configPatches:
    # -----------------------------------------------------------------
    # Upstream clusters (h2, self-signed TLS)
    #
    # Mode-agnostic: the ext-proc HTTP filters (and their body modes)
    # live in modes/base/ext-proc.yaml, applied per-mode by the e2e matrix.
    # -----------------------------------------------------------------
    - applyTo: CLUSTER
      match:
        context: GATEWAY
      patch:
        operation: ADD
        value:
          name: praxis-pre-processing-grpc
          type: STRICT_DNS
          connect_timeout: 5s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                validation_context:
                  trust_chain_verification: ACCEPT_UNTRUSTED
              sni: payload-pre-processing.istio-system.svc.cluster.local
          load_assignment:
            cluster_name: praxis-pre-processing-grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: payload-pre-processing.istio-system.svc.cluster.local
                          port_value: 9004
    - applyTo: CLUSTER
      match:
        context: GATEWAY
      patch:
        operation: ADD
        value:
          name: praxis-processing-grpc
          type: STRICT_DNS
          connect_timeout: 5s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                validation_context:
                  trust_chain_verification: ACCEPT_UNTRUSTED
              sni: payload-processing.istio-system.svc.cluster.local
          load_assignment:
            cluster_name: praxis-processing-grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: payload-processing.istio-system.svc.cluster.local
                          port_value: 9004
