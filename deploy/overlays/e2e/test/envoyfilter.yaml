apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: praxis-extproc
  namespace: istio-system
  labels:
    app.kubernetes.io/name: praxis-extproc
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: e2e-gateway
  configPatches:
    # -----------------------------------------------------------------
    # Upstream clusters (h2, self-signed TLS)
    # -----------------------------------------------------------------
    - applyTo: CLUSTER
      match:
        context: GATEWAY
      patch:
        operation: ADD
        value:
          name: praxis-pre-processing-grpc
          type: STRICT_DNS
          connect_timeout: 5s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                validation_context:
                  trust_chain_verification: ACCEPT_UNTRUSTED
              sni: payload-pre-processing.istio-system.svc.cluster.local
          load_assignment:
            cluster_name: praxis-pre-processing-grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: payload-pre-processing.istio-system.svc.cluster.local
                          port_value: 9004
    - applyTo: CLUSTER
      match:
        context: GATEWAY
      patch:
        operation: ADD
        value:
          name: praxis-processing-grpc
          type: STRICT_DNS
          connect_timeout: 5s
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2"]
                validation_context:
                  trust_chain_verification: ACCEPT_UNTRUSTED
              sni: payload-processing.istio-system.svc.cluster.local
          load_assignment:
            cluster_name: praxis-processing-grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: payload-processing.istio-system.svc.cluster.local
                          port_value: 9004
    # -----------------------------------------------------------------
    # Body modes mirror the production odh overlay (deploy/overlays/odh):
    # BUFFERED request/response bodies and SKIP trailers. Under BUFFERED,
    # Envoy picks the route at headers-time, so a BBR header mutation that
    # lands in the body phase only takes effect if the body-phase response
    # clears the route cache. This is the prod-faithful topology that
    # reproduces the BBR 404 regression the fix PRs address.
    #
    # ipp-pre: BBR — model_to_header extracts model from body, sets
    # X-Gateway-Model-Name and clears the route cache so Envoy
    # re-evaluates routes with the header present.
    # -----------------------------------------------------------------
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ext_proc.ipp-pre
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            failure_mode_allow: true
            allow_mode_override: true
            send_body_without_waiting_for_header_response: true
            grpc_service:
              envoy_grpc:
                cluster_name: praxis-pre-processing-grpc
              timeout: 300s
            message_timeout: 300s
            processing_mode:
              request_header_mode: SEND
              response_header_mode: SKIP
              request_body_mode: BUFFERED
              response_body_mode: NONE
              request_trailer_mode: SKIP
    # -----------------------------------------------------------------
    # ipp: post-processing — response headers, request enrichment.
    # -----------------------------------------------------------------
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ext_proc.ipp
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            failure_mode_allow: false
            allow_mode_override: true
            send_body_without_waiting_for_header_response: true
            grpc_service:
              envoy_grpc:
                cluster_name: praxis-processing-grpc
              timeout: 300s
            message_timeout: 300s
            processing_mode:
              request_header_mode: SEND
              response_header_mode: SEND
              request_body_mode: BUFFERED
              response_body_mode: BUFFERED
              request_trailer_mode: SKIP
              response_trailer_mode: SKIP
