apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-processing-plugins
data:
  extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      # Enforce a small body cap on the fail-closed (failure_mode_allow: false)
      # ext-proc so an oversized body deterministically yields a 5xx. The
      # pre-processing ext-proc stays unbounded so routing still resolves.
      max_body_bytes: 1048576
      tls:
        mode: self_signed

    insecure_options:
      allow_unbounded_body: true
      # ai_guardrails callout to in-cluster nemo-mock (private ClusterIP).
      allow_private_upstreams: true

    # Production-parity ipp chain (see deploy/base/config/configmap.yaml) plus
    # e2e-only markers (X-Guard-Applied, X-Praxis-Version, e2e_body_oracle).
    filter_chains:
      - name: ipp
        filters:
          - filter: headers
            conditions:
              - unless:
                  path_prefix: /maas-api
              - unless:
                  path_prefix: /v1/models
              - unless:
                  path_prefix: /v1/subscriptions
              - unless:
                  path_prefix: /v1/api-keys
              - unless:
                  path: /v1/me
              - when:
                  path_prefix: /direct/internal
            request_remove:
              - authorization
              - x-api-key
              - x-origin-cluster
              - x-maas-username
              - x-maas-username-oc
              - x-maas-username-token
              - x-maas-group
              - x-maas-group-oc
              - x-maas-group-token
              - x-maas-keyname
              - x-maas-key-id
              - x-maas-subscription
              - x-maas-subscription-rate-limit-id
              - x-maas-cost-center
              - x-maas-organization-id
              - x-maas-identity
              - x-maas-admin-scope
              - x-maas-tenant
              - x-maas-invocation-mode
              - x-maas-policy-revision
              - x-maas-responses-owner
              - x-maas-return-all-models
              - x-maas-model
            response_add:
              - name: X-Guard-Applied
                value: "true"
          # E2e-only NeMo guardrails (not on deploy/base production ipp). Scoped to
          # chat completions so JSON BBR paths (/v1/embeddings, /v1/completions,
          # …) are not evaluated as OpenAI chat by ai_guardrails.
          - filter: ai_guardrails
            conditions:
              - when:
                  path_prefix: /v1/chat/completions
            provider:
              type: nemo
              endpoint: "http://nemo-mock.llm.svc.cluster.local:8080/v1/checks"
              timeout_ms: 2000
            phase:
              request: true
              response: true
          - filter: request_id
          - filter: headers
            response_set:
              - name: X-Praxis-Version
                value: "e2e"
          - filter: e2e_body_oracle
