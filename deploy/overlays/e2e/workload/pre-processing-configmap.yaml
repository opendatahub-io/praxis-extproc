apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-pre-processing-plugins
data:
  extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      tls:
        mode: self_signed

    filter_chains:
      - name: bbr
        filters:
          - filter: model_to_header
            header: X-Gateway-Model-Name
          # Mirror deploy/base: normalize publishers/<pub>/models/<name> body
          # model values to the short <name> for KServe/LLMISvc routing.
          - filter: llmisvc_model_provider_resolver
            header: X-Gateway-Model-Name

    insecure_options:
      allow_unbounded_body: true
