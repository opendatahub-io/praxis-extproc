apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-pre-processing-plugins
data:
  extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      # Keep BBR above the IPP e2e 1 MiB cap so oversized-body tests still reach
      # the fail-closed post-auth ext-proc.
      max_body_bytes: 10485760
      tls:
        mode: self_signed

    filter_chains:
      - name: bbr
        filters:
          # Mirror ODH production BBR: strip any caller-supplied routing header
          # so routing identity always comes from the JSON body.
          - filter: headers
            request_remove:
              - X-Gateway-Model-Name
          - filter: json_body
            request_extract:
              - pointer: /model
                header: X-Gateway-Model-Name
            on_invalid: continue
          - filter: e2e_body_oracle
