apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-processing-streaming-plugins
data:
  extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      max_body_bytes: 1048576
      tls:
        mode: self_signed

    # Minimal ipp chain for SSE pass-through on e2e-streaming-gateway (no
    # response-body filters that buffer or reject streaming).
    filter_chains:
      - name: streaming-e2e
        filters:
          - filter: json_body
            request_extract:
              - pointer: /model
                header: X-Model-Name
            on_invalid: continue
          - filter: headers
            request_add:
              - name: X-Praxis-Processed
                value: "true"
            response_set:
              - name: X-Praxis-Version
                value: "e2e-streaming"
