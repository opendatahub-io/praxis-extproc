# Header-reflecting echo backend for the integrity profile's trust-boundary
# ground-truth test (#165). The istio test app echoes the received request
# (method, path, headers) in its response body, so a test can assert what
# ACTUALLY reached the backend after the ext-proc chain ran — complementing the
# e2e_header_oracle, which only reports the ext-proc's forwarding intent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-backend
  namespace: llm
  labels:
    app: echo-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-backend
  template:
    metadata:
      labels:
        app: echo-backend
    spec:
      containers:
        - name: echo
          image: gcr.io/istio-testing/app:latest
          args:
            - "--port=8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo-backend
  namespace: llm
  labels:
    app: echo-backend
spec:
  selector:
    app: echo-backend
  ports:
    - port: 8080
      targetPort: 8080
