apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: e2e-streaming-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: e2e-streaming-route
  namespace: istio-system
spec:
  parentRefs:
    - name: e2e-streaming-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      backendRefs:
        - name: llm-katan
          namespace: llm
          port: 443
