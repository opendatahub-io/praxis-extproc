apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# BUFFERED requests and STREAMED responses, as used with API translation.
resources:
  - ../base

patches:
  - target:
      kind: EnvoyFilter
      name: praxis-extproc-ext-proc
    path: mode-patch.yaml
  - target:
      kind: EnvoyFilter
      name: praxis-extproc-streaming
    path: streaming-mode-patch.yaml
