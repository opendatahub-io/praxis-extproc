apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# MaaS IPP entrypoint. Namespace is supplied by the consumer (MaaS PostRender).
# Placeholder FQDNs / gateway names (openshift-ingress, maas-default-gateway)
# are rewritten by the controller.
resources:
  - after
  - pre-processing
  - ../../base/config
  - envoy-filter.yaml
  - rbac
  - networking

images:
  - name: praxis-extproc
    newName: praxis-extproc
    newTag: dev

patches:
  - target:
      kind: Deployment
      name: payload-processing
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: payload-processing
