- op: replace
  path: /metadata/name
  value: payload-pre-processing
- op: replace
  path: /spec/selector/matchLabels/app
  value: payload-pre-processing
- op: replace
  path: /spec/template/metadata/labels/app
  value: payload-pre-processing
- op: replace
  path: /spec/template/spec/containers/0/name
  value: payload-pre-processing
- op: replace
  path: /spec/template/spec/containers/0/args
  value:
    - -c
    - /etc/praxis/pre-extproc.yaml
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      # BBR holds the buffered JSON body while promoting model headers; size for
      # at least one 32 MiB request without OOM-kill.
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "256Mi"
      cpu: "200m"
- op: add
  path: /spec/template/spec/serviceAccountName
  value: payload-processing
