- op: replace
  path: /metadata/name
  value: payload-pre-processing
- op: replace
  path: /metadata/annotations/secret.reloader.stakater.com~1reload
  value: payload-pre-processing-tls
- op: replace
  path: /spec/selector/matchLabels/app
  value: payload-pre-processing
- op: replace
  path: /spec/template/metadata/labels/app
  value: payload-pre-processing
- op: replace
  path: /spec/template/spec/containers/0/name
  value: payload-pre-processing
- op: replace
  path: /spec/template/spec/containers/0/args
  value:
    - -c
    - /etc/praxis/pre-extproc.yaml
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      # BBR holds the buffered JSON body while promoting model headers. Budget
      # assumes max_body_bytes 10 MiB × max_requests 8 with GRPC_MAX_RECV 11Mi
      # (see base Deployment env) under this 256 MiB limit.
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "256Mi"
      cpu: "200m"
- op: add
  path: /spec/template/spec/serviceAccountName
  value: payload-processing
- op: replace
  path: /spec/template/spec/volumes/1/secret/secretName
  value: payload-pre-processing-tls
