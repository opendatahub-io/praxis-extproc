apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: istio-system

resources:
  - workload/payload-pre-processing-plugins.yaml
  - workload/payload-processing-plugins.yaml
  - envoyfilter-ext-proc-guard.yaml
  - envoyfilter-pre-oracle-response-headers.yaml
  - access-log-reuse.yaml
  - access-log-tls-negative.yaml
  # pool-configs/*.yaml are patched into praxis-extproc-clusters per idle-matrix
  # cell via hack/patch-e2e-extended-pool-idle.py (not both at once).

patches:
  - path: workload/pre-processing-hop-index.yaml
    target:
      kind: Deployment
      name: payload-pre-processing
  - path: workload/payload-processing-hop-index.yaml
    target:
      kind: Deployment
      name: payload-processing
