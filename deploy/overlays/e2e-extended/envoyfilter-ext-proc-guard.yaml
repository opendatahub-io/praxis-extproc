# Extended qualification guard: fail closed with HTTP 503 on ext_proc errors.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: e2e-extended-ext-proc-guard
  namespace: istio-system
  labels:
    app.kubernetes.io/component: e2e-extended
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: e2e-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_proc.ipp-pre
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            failure_mode_allow: false
            status_on_error:
              code: 503
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_proc.ipp
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            failure_mode_allow: false
            status_on_error:
              code: 503
