apiVersion: apps/v1
kind: Deployment
metadata:
  name: payload-processing
spec:
  template:
    spec:
      containers:
        - name: payload-processing
          volumeMounts:
            - name: plugins-config-volume
              mountPath: /etc/praxis
              readOnly: true
            - name: tls-certs
              mountPath: /etc/praxis-tls
              readOnly: true
      volumes:
        - name: plugins-config-volume
          configMap:
            name: payload-processing-plugins
        - name: tls-certs
          secret:
            secretName: e2e-extended-tls-server
