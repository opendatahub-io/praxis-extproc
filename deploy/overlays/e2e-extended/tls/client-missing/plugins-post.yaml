# Post-IPP: AI filters + body oracle, provided TLS with client CA (mTLS).
apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-processing-plugins
  namespace: istio-system
data:
  extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      tls:
        mode: provided
        cert_path: /etc/praxis-tls/tls.crt
        key_path: /etc/praxis-tls/tls.key
        ca_cert_path: /etc/praxis-tls/ca.crt

    filter_chains:
      - name: ai-filters
        filters:
          - filter: anthropic_messages_to_chat_completions
          - filter: model_to_header
            header: X-Model-Name
          - filter: headers
            request_add:
              - name: X-Praxis-Processed
                value: "true"
            response_set:
              - name: X-Praxis-Version
                value: "e2e"
          - filter: e2e_body_oracle
