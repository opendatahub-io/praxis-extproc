apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-processing-plugins
data:
  # Pre-auth (BBR) Praxis chain: promote body model to a routing header, then
  # rewrite publisher IDs in the JSON body for KServe upstream routing.
  pre-extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      # Default 10 MiB body bound. Paired with Envoy ExtProc max_requests=8 so
      # worst-case buffered bodies (~80 MiB) fit under the ODH ExtProc memory
      # limit with headroom. Operators can raise either value via ai-gateway-
      # controller annotations; keep requests*body under the pod limit.
      # Do not set insecure_options.allow_unbounded_body: after RHOAIENG-102139
      # that flag would leave streamed bodies uncapped. Hard ceiling remains
      # the 32 MiB gRPC max.
      max_body_bytes: 10485760
      tls:
        mode: provided
        cert_path: /etc/tls/private/tls.crt
        key_path: /etc/tls/private/tls.key

    filter_chains:
      - name: bbr
        filters:
          # Strip any caller-supplied routing header before promoting body
          # "model". Trusting the header under ExtProc fail-open would let
          # clients steer KServe pool routes (see ai-gateway-controller#217).
          - filter: headers
            request_remove:
              - X-Gateway-Model-Name
          - filter: json_body
            request_extract:
              - pointer: /model
                header: X-Gateway-Model-Name
            on_invalid: continue
          - filter: llmisvc_model_provider_resolver
            header: X-Gateway-Model-Name

  # Post-auth (IPP) Praxis chain: full processing pipeline.
  extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      # Default 10 MiB body bound. Paired with Envoy ExtProc max_requests=8 so
      # worst-case buffered bodies (~80 MiB) fit under the ODH ExtProc memory
      # limit with headroom. Operators can raise either value via ai-gateway-
      # controller annotations; keep requests*body under the pod limit.
      # Do not set insecure_options.allow_unbounded_body: after RHOAIENG-102139
      # that flag would leave streamed bodies uncapped. Hard ceiling remains
      # the 32 MiB gRPC max.
      max_body_bytes: 10485760
      tls:
        mode: provided
        cert_path: /etc/tls/private/tls.crt
        key_path: /etc/tls/private/tls.key

    filter_chains:
      - name: ipp
        filters:
          # Port of legacy IPP maas-headers-guard: strip caller credentials
          # and internal MaaS headers for requests targeting non maas-api paths.
          - filter: headers
            conditions:
              - unless:
                  path_prefix: /maas-api
              - unless:
                  path_prefix: /v1/models
              - unless:
                  path_prefix: /v1/subscriptions
              - unless:
                  path_prefix: /v1/api-keys
              - unless:
                  path: /v1/me
            request_remove:
              - authorization
              - x-api-key
              - x-origin-cluster
              - x-maas-username
              - x-maas-username-oc
              - x-maas-username-token
              - x-maas-group
              - x-maas-group-oc
              - x-maas-group-token
              - x-maas-keyname
              - x-maas-key-id
              - x-maas-subscription
              - x-maas-subscription-rate-limit-id
              - x-maas-cost-center
              - x-maas-organization-id
              - x-maas-identity
              - x-maas-admin-scope
              - x-maas-tenant
              - x-maas-invocation-mode
              - x-maas-policy-revision
              - x-maas-responses-owner
              - x-maas-return-all-models
              - x-maas-model
          - filter: request_id
