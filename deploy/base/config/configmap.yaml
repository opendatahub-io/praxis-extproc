apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-processing-plugins
data:
  # Pre-auth (BBR) Praxis chain: promote body model to a routing header, then
  # rewrite publisher IDs in the JSON body for KServe upstream routing.
  pre-extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      tls:
        mode: self_signed

    filter_chains:
      - name: bbr
        filters:
          # Promote body "model" into X-Gateway-Model-Name; `unless` trusts an
          # existing header. For untrusted ingress, drop it and strip the header
          # with `headers request_remove` before json_body.
          - filter: json_body
            conditions:
              - unless:
                  headers_present: ["X-Gateway-Model-Name"]
            request_extract:
              - pointer: /model
                header: X-Gateway-Model-Name
            on_invalid: continue
          - filter: llmisvc_model_provider_resolver
            header: X-Gateway-Model-Name

    insecure_options:
      allow_unbounded_body: true

  # Post-auth (IPP) Praxis chain: full processing pipeline.
  extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      tls:
        mode: self_signed

    filter_chains:
      - name: ipp
        filters:
          # Port of legacy IPP maas-headers-guard: strip caller credentials
          # and internal MaaS headers for requests targeting non maas-api paths.
          - filter: headers
            conditions:
              - unless:
                  path_prefix: /maas-api
              - unless:
                  path_prefix: /v1/models
              - unless:
                  path_prefix: /v1/subscriptions
              - unless:
                  path_prefix: /v1/api-keys
              - unless:
                  path: /v1/me
            request_remove:
              - authorization
              - x-api-key
              - x-origin-cluster
              - x-maas-username
              - x-maas-username-oc
              - x-maas-username-token
              - x-maas-group
              - x-maas-group-oc
              - x-maas-group-token
              - x-maas-keyname
              - x-maas-key-id
              - x-maas-subscription
              - x-maas-subscription-rate-limit-id
              - x-maas-cost-center
              - x-maas-organization-id
              - x-maas-identity
              - x-maas-admin-scope
              - x-maas-tenant
              - x-maas-invocation-mode
              - x-maas-policy-revision
              - x-maas-responses-owner
              - x-maas-return-all-models
              - x-maas-model
          - filter: request_id

    insecure_options:
      allow_unbounded_body: true
