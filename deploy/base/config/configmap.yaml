apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-processing-plugins
data:
  # Pre-auth (BBR) Praxis chain: lightweight model extraction only.
  pre-extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      tls:
        mode: self_signed

    filter_chains:
      - name: bbr
        filters:
          - filter: model_to_header
            header: X-Gateway-Model-Name

    insecure_options:
      allow_unbounded_body: true

  # Post-auth (IPP) Praxis chain: full processing pipeline.
  extproc.yaml: |
    server:
      grpc_address: "0.0.0.0:9004"
      health_address: "0.0.0.0:50052"
      metrics_address: "0.0.0.0:9090"
      tls:
        mode: self_signed

    filter_chains:
      - name: ipp
        filters:
          - filter: request_id

    insecure_options:
      allow_unbounded_body: true
