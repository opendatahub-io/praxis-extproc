apiVersion: v1
kind: Service
metadata:
  name: payload-processing
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: payload-processing-tls
spec:
  selector:
    app: payload-processing
  ports:
    - protocol: TCP
      port: 9004
      targetPort: 9004
      appProtocol: HTTP2
  type: ClusterIP
