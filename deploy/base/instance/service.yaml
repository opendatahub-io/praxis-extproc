apiVersion: v1
kind: Service
metadata:
  name: payload-processing
  # OpenShift service-ca annotation is applied by the ODH overlay (and by
  # ai-gateway-controller Rename). Keep it out of the shared base so demo/e2e
  # and plain Kubernetes installs are not forced onto an OpenShift Secret.
spec:
  selector:
    app: payload-processing
  ports:
    - protocol: TCP
      port: 9004
      targetPort: 9004
      appProtocol: HTTP2
  type: ClusterIP
