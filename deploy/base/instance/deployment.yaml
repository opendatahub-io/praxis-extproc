apiVersion: apps/v1
kind: Deployment
metadata:
  name: payload-processing
  annotations:
    # Restart pods when the serving-cert Secret is rotated (OpenShift service-ca
    # updates the Secret; kubelet refreshes the mount, but the process loads
    # certs only at startup). No-op unless Reloader or an equivalent controller
    # is installed. In-process hot reload is tracked separately.
    secret.reloader.stakater.com/reload: payload-processing-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payload-processing
  template:
    metadata:
      labels:
        app: payload-processing
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: payload-processing
          image: praxis-extproc
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          args:
            - -c
            - /etc/praxis/extproc.yaml
          ports:
            - containerPort: 9004
              name: grpc
              protocol: TCP
            - containerPort: 50052
              name: health
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            # Pair tonic decode with server.max_body_bytes (10 MiB) + 1 MiB
            # ProcessingRequest framing headroom. Leaving the binary default
            # (~33 MiB) would allocate before the 413 path and inflate peak
            # RSS under max_requests=8 (see RHAIENG-8104).
            - name: GRPC_MAX_RECV_MSG_SIZE
              value: "11Mi"
          resources:
            requests:
              # Headroom for concurrent BUFFERED bodies at max_body_bytes (10 MiB)
              # × ExtProc max_requests (8) plus decode/filter copies.
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            grpc:
              port: 50052
              service: envoy.service.ext_proc.v3.ExternalProcessor
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: plugins-config-volume
              mountPath: /etc/praxis
              readOnly: true
            - name: tls
              mountPath: /etc/tls/private
              readOnly: true
      volumes:
        - name: plugins-config-volume
          configMap:
            name: payload-processing-plugins
        - name: tls
          secret:
            secretName: payload-processing-tls
