name: K8s E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  EXTPROC_IMAGE: praxis-extproc:dev
  CONTAINER_ENGINE: docker

permissions: {}

jobs:
  k8s-e2e:
    name: K8s E2E (${{ matrix.mode }})
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [buffered, streamed, fds]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - uses: ./.github/actions/setup-e2e-tools

      - name: Setup e2e environment
        run: make e2e-setup MODE=${{ matrix.mode }}

      - name: Run K8s e2e tests
        run: make e2e-test V=1 MODE=${{ matrix.mode }}

      - name: Diagnostics
        if: failure()
        run: |
          kubectl --context kind-praxis-e2e get pods -A || true
          kubectl --context kind-praxis-e2e get gateways,httproutes,referencegrants -A -o yaml || true
          kubectl --context kind-praxis-e2e get services -n istio-system -o wide || true
          kubectl --context kind-praxis-e2e logs -n istio-system deployment/istiod --tail=200 || true
          kubectl --context kind-praxis-e2e describe pods -n istio-system || true
          kubectl --context kind-praxis-e2e logs -n istio-system \
            -l app=payload-processing --tail=100 || true
          kubectl --context kind-praxis-e2e logs -n istio-system \
            -l app=payload-pre-processing --tail=100 || true
          kubectl --context kind-praxis-e2e describe pods -n praxis-extproc || true
          kubectl --context kind-praxis-e2e logs -n praxis-extproc -l app=praxis --tail=100 || true
          kubectl --context kind-praxis-e2e get events -A --sort-by='.lastTimestamp' | tail -30 || true

      - name: Teardown
        if: always()
        run: make e2e-teardown
