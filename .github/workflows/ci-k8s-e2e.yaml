name: K8s E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_extended:
        description: "Run qualification-tier (extended) e2e"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  EXTPROC_IMAGE: praxis-extproc:dev
  CONTAINER_ENGINE: docker

permissions: {}

jobs:
  simulator-check:
    name: Check simulator connectivity
    runs-on: ubuntu-24.04
    outputs:
      reachable: ${{ steps.check.outputs.reachable }}
    steps:
      - name: Check llm-katan reachability
        id: check
        run: |
          if nc -z -w 5 3.147.232.199 443; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "llm-katan is reachable"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "llm-katan is NOT reachable — skipping e2e tests"
          fi

  k8s-e2e:
    name: K8s E2E (${{ matrix.mode }})
    timeout-minutes: 30
    permissions:
      contents: read
    needs: simulator-check
    if: needs.simulator-check.outputs.reachable == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [buffered, fds]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - uses: ./.github/actions/setup-e2e-tools

      - name: Setup e2e environment
        run: make e2e-setup MODE=${{ matrix.mode }}

      - name: Run K8s e2e tests
        run: make e2e-test V=1

      - name: Diagnostics
        if: failure()
        run: |
          kubectl --context kind-praxis-e2e get pods -A
          kubectl --context kind-praxis-e2e describe pods -n praxis-extproc
          kubectl --context kind-praxis-e2e logs -n praxis-extproc -l app=praxis --tail=100
          kubectl --context kind-praxis-e2e get events -A --sort-by='.lastTimestamp' | tail -30

      - name: Teardown
        if: always()
        run: make e2e-teardown

  k8s-e2e-extended:
    name: K8s E2E Extended (qualification)
    timeout-minutes: 120
    permissions:
      contents: read
    needs: simulator-check
    if: >-
      needs.simulator-check.outputs.reachable == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_extended
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - uses: ./.github/actions/setup-e2e-tools

      - name: Setup extended e2e environment
        run: make e2e-setup-extended

      - name: Run extended qualification tests
        run: make test-e2e-extended V=1

      - name: Upload extended artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-extended-report
          path: target/e2e-extended/**

      - name: Diagnostics
        if: failure()
        run: |
          kubectl --context kind-praxis-e2e get pods -A
          kubectl --context kind-praxis-e2e describe pods -n praxis-extproc
          kubectl --context kind-praxis-e2e logs -n praxis-extproc -l app=praxis --tail=100
          kubectl --context kind-praxis-e2e get events -A --sort-by='.lastTimestamp' | tail -30

      - name: Teardown
        if: always()
        run: make e2e-teardown
