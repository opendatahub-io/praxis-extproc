name: K8s E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  EXTPROC_IMAGE: praxis-extproc:dev

jobs:
  simulator-check:
    name: Check simulator connectivity
    runs-on: ubuntu-24.04
    outputs:
      reachable: ${{ steps.check.outputs.reachable }}
    steps:
      - name: Check llm-katan reachability
        id: check
        run: |
          if nc -z -w 5 3.147.232.199 443; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "llm-katan is reachable"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "llm-katan is NOT reachable — skipping e2e tests"
          fi

  k8s-e2e:
    name: K8s E2E
    needs: simulator-check
    if: needs.simulator-check.outputs.reachable == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.29.0

      - name: Install istioctl
        run: |
          curl -sL https://istio.io/downloadIstio | ISTIO_VERSION=1.29.2 sh -
          echo "$PWD/istio-1.29.2/bin" >> "$GITHUB_PATH"

      - name: Install praxis-forge
        run: cargo install --git https://github.com/praxis-proxy/grid.git forge --locked

      - name: Setup e2e environment
        run: make e2e-setup

      - name: Wait for pods
        run: |
          echo "Waiting for praxis pod to be ready..."
          kubectl --context kind-praxis-e2e wait --for=condition=ready pod -n praxis-extproc -l app=praxis --timeout=120s || true
          echo "Waiting for gateway pod to be ready..."
          kubectl --context kind-praxis-e2e wait --for=condition=ready pod -l gateway.networking.k8s.io/gateway-name=e2e-gateway --timeout=120s || true

      - name: Run K8s e2e tests
        run: make e2e-test V=1

      - name: Debug cluster state
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl --context kind-praxis-e2e get pods -A
          echo "=== Praxis pod logs ==="
          kubectl --context kind-praxis-e2e logs -n praxis-extproc -l app=praxis --tail=100 --previous 2>/dev/null || true
          kubectl --context kind-praxis-e2e logs -n praxis-extproc -l app=praxis --tail=100 || echo "(no logs)"
          echo "=== Praxis pod describe ==="
          kubectl --context kind-praxis-e2e describe pod -n praxis-extproc -l app=praxis | tail -40 || echo "(no pod)"
          echo "=== Gateway pod logs ==="
          kubectl --context kind-praxis-e2e logs -l gateway.networking.k8s.io/gateway-name=e2e-gateway --tail=30 || echo "(no logs)"

      - name: Teardown
        if: always()
        run: make e2e-teardown
