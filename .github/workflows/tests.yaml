name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: praxis-proxy/conventions/.github/actions/setup-rust-lint@v0.1.0
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo +nightly fmt --all -- --check

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: praxis-proxy/conventions/.github/actions/setup-rust@v0.1.0
      - run: cargo build --release

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: praxis-proxy/conventions/.github/actions/setup-rust@v0.1.0
      - run: cargo test

  doc:
    name: Documentation
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: praxis-proxy/conventions/.github/actions/setup-rust@v0.1.0
        with:
          cache-suffix: doc
      - run: cargo doc --no-deps --document-private-items

  audit:
    name: Supply Chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: praxis-proxy/conventions/.github/actions/supply-chain-audit@v0.1.0
