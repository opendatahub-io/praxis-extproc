name: FIPS

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# The product image on UBI 9, checked the way Red Hat checks it: first the
# dependency graph against Red Hat's denylist, then the compliance report (a
# reason and a pointer for every finding), then Red Hat's own scanner,
# openshift/check-payload at its Rust-support revision, against the runtime
# image with warnings fatal. Runs on every pull request and push to main so a
# change that breaks FIPS compliance never reaches the image.
#
# Everything runs through the Makefile targets developers use locally (see
# docs/fips.md), with podman: Red Hat's image signatures can only be verified
# with podman, and the scanner reads podman's image store. Ubuntu's podman
# packaging ships no registries.d entry for Red Hat's registry, so the job
# first tells podman where the signatures live (make fips-signature-store),
# as a developer on Debian or Ubuntu would.
#
# The second job, fips-host, is the runtime proof the hosted job cannot
# give: on the self-hosted RHEL 9 runner in FIPS mode it attests the host
# and the image's module build, runs the test suite as the FIPS build
# inside the toolchain image, and probes the exact image the hosted job
# built and scanned, handed over as an artifact and checked by id. It never
# runs a fork's code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly runtime proof; clear of the praxis and praxis-ai schedules so
    # the three repos take turns on the shared runner.
    - cron: "23 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # UBI 9 image: dependency graph, compliance report, then Red Hat's scanner
  # ----------------------------------------------------------------------------

  ubi-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      image-id: ${{ steps.save.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: praxis-proxy/conventions/.github/actions/setup-rust@7e1e8d97c2dc820d24b31f9a65b119c4d0e5342c # v0.1.0
        with:
          # Only xtask is built on the host; keep that off the shared cache key
          # and skip caching its target.
          cache-suffix: fips
          cache-target: "false"

      - name: Set up Go (builds Red Hat's scanner)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          # The scanner is fetched by make fips-scanner and vendors its modules.
          cache: false

      - name: Dependency graph against Red Hat's denylist (seconds; fails first)
        run: make fips-deps

      - name: Build Red Hat's scanner (check-payload) at the pinned revision
        run: make fips-scanner

      - name: Install the OpenShift CLI (check-payload refuses to scan without oc)
        env:
          # A fixed release from Red Hat's mirror; the digest is the one in that
          # release's sha256sum.txt, which is signed with Red Hat's release key 2.
          OC_URL: https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/4.21.33/openshift-client-linux-amd64-rhel9-4.21.33.tar.gz
          OC_SHA256: 59b83765c889d9ae8b05ead5e2a4559d913bb24fd9065ab3c08279317da52f67
        run: |
          mkdir -p "$RUNNER_TEMP/oc"
          curl -sSfL -o "$RUNNER_TEMP/oc.tar.gz" "$OC_URL"
          echo "$OC_SHA256  $RUNNER_TEMP/oc.tar.gz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/oc.tar.gz" -C "$RUNNER_TEMP/oc" oc
          echo "$RUNNER_TEMP/oc" >> "$GITHUB_PATH"

      - name: Point podman at Red Hat's signature store (Ubuntu's podman has no entry for it)
        run: make fips-signature-store

      - name: Verify the Red Hat base images are signed by Red Hat
        run: make fips-verify-image

      - name: Build on UBI 9 with Red Hat's toolchain and print the compliance report
        run: make fips-check

      - name: Build the product image
        run: make container-release CONTAINER_ENGINE=podman

      - name: Run the image once (validates the example config with the system OpenSSL)
        run: make fips-smoke

      - name: Scan the image with check-payload (warnings fatal)
        run: make fips-scan

      - name: Save the image for the FIPS runner
        id: save
        run: |
          make fips-image-save
          echo "image-id=$(cat target/fips/praxis-extproc-fips-image.tar.id)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fips-image
          path: |
            target/fips/praxis-extproc-fips-image.tar
            target/fips/praxis-extproc-fips-image.tar.id
          if-no-files-found: error
          retention-days: 3

  # ----------------------------------------------------------------------------
  # FIPS host: the runtime proof, on the RHEL 9 runner in FIPS mode
  # ----------------------------------------------------------------------------

  fips-host:
    needs: ubi-image
    # Never a fork's code on the self-hosted runner: pull requests only from
    # this repository's own branches.
    if: >-
      needs.ubi-image.result == 'success'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, fips, rhel]
    # Queue behind this repository's other runs rather than pile up; the
    # runner itself takes one job at a time, which is what serializes it
    # with the praxis and praxis-ai repositories sharing the machine.
    concurrency:
      group: fips-host-runner
      cancel-in-progress: false
    # Building the suite in the toolchain image from a cold cache dominates.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/fips-runner-check

      - name: Fetch the image the hosted job built and scanned
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: fips-image
          path: target/fips

      - name: Load it and check it is that image
        env:
          EXPECTED_ID: ${{ needs.ubi-image.outputs.image-id }}
        run: |
          make fips-image-load
          [ "$(cat target/fips/praxis-extproc-fips-image.tar.id)" = "$EXPECTED_ID" ] \
            || { echo "::error::the archive's image id does not match the one the hosted job recorded"; exit 1; }

      - uses: ./.github/actions/fips-host
        with:
          run-suites: "true"

      - name: Remove the loaded image
        if: always()
        run: podman rmi --force "$(make -s fips-image-ref)" || true
